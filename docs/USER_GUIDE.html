    const markdownText = "# \ud83c\udfb5 StemForge Studio v2.0 (\u9032\u968e\u5927\u6539\u7248) \u2014 \u5b8c\u6574\u5716\u6587\u64cd\u4f5c\u624b\u518a\n\n> **\u9069\u7528\u7248\u672c**\uff1a`StemForge Studio v2.0.0` (Portable Win-x64)  \n> **\u767c\u5e03\u65e5\u671f**\uff1a2026 \u5e74 10 \u6708  \n> **\u6838\u5fc3\u6280\u8853**\uff1a.NET 9.0 SIMD DSP + NVIDIA GPU CUDA 11.8 4-Pass Neural Cascade + WebAudio \u591a\u8ecc\u6df7\u97f3 DAW + \u975e\u7834\u58de\u6027\u7247\u6bb5\u526a\u8f2f\u5de5\u574a + Phase-Vocoder \u9ad8\u4fdd\u771f\u8b8a\u8abf\u8b8a\u901f\n\n---\n\n## \ud83c\udf1f v2.0 \u9032\u968e\u7248\u6700\u65b0\u91cd\u5927\u529f\u80fd\u4e00\u89bd (What's New in v2.0)\n\n![StemForge Studio v2.0 \u5168\u666f\u6df7\u97f3\u53f0](images/stemforge_v2_daw.png)\n\n\u5728\u6700\u65b0\u7684 **v2.0 \u9032\u968e\u7248** \u4e2d\uff0c\u5de5\u4f5c\u7ad9\u8fce\u4f86\u4e86\u5168\u65b9\u4f4d\u5de5\u4f5c\u6d41\u7684\u5927\u6539\u7248\uff1a\n\n1. \u2702\ufe0f **\u975e\u7834\u58de\u6027\u7de8\u66f2\u7247\u6bb5\u526a\u8f2f\u8207\u5c40\u90e8\u6d88\u97f3\u5de5\u574a (Non-destructive Scissors & Clip Mute)**\uff1a\n   ![\u7247\u6bb5\u526a\u8f2f\u8207\u6d88\u97f3\u8996\u89ba](images/stemforge_v2_editing.png)\n   - **\ud83d\udd90\ufe0f \u9078\u53d6\u6a21\u5f0f (\u5feb\u6377\u9375 1)**\uff1a\u81ea\u7531\u9ede\u64ca\u6ce2\u5f62\u9032\u884c\u6642\u9593\u8ef8\u5c0b\u8ecc\u8207\u64ad\u653e\u3002\n   - **\u2702\ufe0f \u526a\u5200\u5207\u5206\u6a21\u5f0f (\u5feb\u6377\u9375 2)**\uff1a\u5728\u4efb\u610f\u5206\u8ecc\u7684\u97f3\u8a0a\u6ce2\u5f62\u4e0a\u9ede\u64ca\u5373\u53ef\u5207\u958b\u7247\u6bb5\uff0c\u6beb\u79d2\u7d1a\u7cbe\u78ba\u5206\u6bb5\uff0c\u5b8c\u5168\u4e0d\u7834\u58de\u539f\u59cb\u5e95\u5c64\u97f3\u8a0a\u6a94\u6848\u3002\n   - **\ud83d\udd07 \u7247\u6bb5\u5c40\u90e8\u6d88\u97f3\u6a21\u5f0f (\u5feb\u6377\u9375 3)**\uff1a\u5207\u5206\u5f8c\u9ede\u64ca\u4efb\u610f\u7247\u6bb5\u5373\u53ef\u5c07\u8a72\u7247\u6bb5\u300c\u5c40\u90e8\u6d88\u97f3\u300d\uff0c\u756b\u5e03\u5373\u6642\u6e32\u67d3\u659c\u7d0b\u534a\u900f\u660e\u6d88\u97f3\u906e\u7f69\uff1b\u518d\u6b21\u9ede\u64ca\u7acb\u5373\u53d6\u6d88\u6d88\u97f3\uff1b\u64ad\u653e\u3001\u6df7\u97f3\u8207\u532f\u51fa\u81ea\u52d5\u540c\u6b65\u751f\u6548\u3002\n   - **\u27f2 \u91cd\u7f6e\u526a\u8f2f**\uff1a\u4e00\u9375\u9084\u539f\u6240\u6709\u5206\u8ecc\u4e4b\u88c1\u5207\u7247\u6bb5\u8207\u6d88\u97f3\u8a2d\u5b9a\u3002\n\n2. \ud83d\udcbe **\u96d9\u91cd\u5c08\u6848\u6301\u4e45\u5316\u7ba1\u7406\uff08Save State & Save As\uff09**\uff1a\n   - **\ud83d\udcbe \u5132\u5b58\u5c08\u6848 (\u5feb\u6377\u9375 `Ctrl + S`)**\uff1a\u96a8\u6642\u5c07\u7576\u524d\u5de5\u7a0b\u4e4b\u63a8\u687f\u97f3\u91cf\u3001Pan \u8072\u76f8\u3001Solo/Mute\u3001\u88c1\u5207\u65b7\u9ede\u8207\u5c40\u90e8\u6d88\u97f3\u7247\u6bb5\u5373\u6642\u5beb\u5165\u5c08\u6848\u72c0\u614b\u6a94\u3002\n   - **\ud83d\udcd1 \u53e6\u5b58\u65b0\u5c08\u6848**\uff1a\u652f\u63f4\u81ea\u8a02\u547d\u540d\u53e6\u5b58\u70ba\u5168\u65b0\u5de5\u7a0b\u526f\u672c\uff0c\u5e95\u5c64\u97f3\u8a0a\u8207\u6ce2\u5f62\u5feb\u53d6\u76f4\u63a5\u8907\u7528\u96f6\u7b49\u5f85\uff0c\u56de\u8f09 100% \u9084\u539f\u6d88\u97f3\u7247\u6bb5\u3002\n\n3. \ud83c\udfa7 **\u97f3\u6e90\u8f09\u5165\u524d\u5373\u6642\u8a66\u807d\u64ad\u653e\u5668 (Source Pre-listen Player)**\uff1a\n   - \u5de6\u5074\u97f3\u6e90\u5340\u584a\u5167\u5efa\u5373\u6642\u97f3\u8a0a\u8a66\u807d\u8ff7\u4f60\u64ad\u653e\u5668\u3002\n   - \u652f\u63f4\u62d6\u66f3/\u9078\u6a94\uff08`blob:` \u5373\u6642\u5feb\u53d6\uff09\u8207\u672c\u6a5f\u7d55\u5c0d\u8def\u5f91\uff08`/api/preview/local-file` HTTP 206 \u4e32\u6d41\uff09\u3002\n   - \u5728\u555f\u52d5\u8017\u6642\u7684\u5206\u96e2\u904b\u7b97\u524d\uff0c\u53ef\u5148\u6309\u4e0b\u64ad\u653e\u9375\u9810\u807d\u97f3\u8a0a\u662f\u5426\u6b63\u78ba\u7121\u8aa4\uff0c\u907f\u514d\u9078\u932f\u6a94\u6848\u3002\n\n4. \u2611\ufe0f **\u6df7\u97f3\u53f0\u5de5\u5177\u5217\u300c\u5168\u9078 / \u5168\u6e05\u300d\u5feb\u901f\u9375**\uff1a\n   - \u5de5\u5177\u5217\u9996\u4f4d\u914d\u7f6e\u300c\u2611\ufe0f \u5168\u9078\u300d\u8207\u300c\u2b1c \u5168\u6e05\u300d\u6309\u9215\uff0c\u5782\u76f4\u5c0d\u9f4a\u4e0b\u65b9\u97f3\u8ecc\u7684\u52fe\u9078\u6846\uff0c\u4e00\u9375\u5168\u52fe\u6216\u5168\u6d88\u3002\n\n5. \ud83c\udfbc **\u539f\u66f2\u8abf\u6027\u667a\u6167\u81ea\u52d5\u8fa8\u8b58 & \u591a\u8ecc Phase-Vocoder \u9ad8\u4fdd\u771f\u8b8a\u8abf ($\\pm 6$ \u534a\u97f3)**\uff1a  \n   - \u97f3\u8a0a\u8f09\u5165\u8207\u5206\u6790\u5b8c\u6210\u5f8c\uff0c\u7cfb\u7d71\u81ea\u52d5\u4ee5 12 \u97f3\u7d1a Chroma \u7279\u5fb5\u77e9\u9663\u8207 Krumhansl-Schmuckler \u6f14\u7b97\u6cd5\u6bd4\u5c0d 24 \u7a2e\u5927\u5c0f\u8abf\uff0c\u5373\u6642\u65bc Master \u63a7\u5236\u5217\u5448\u73fe\u6b4c\u66f2\u539f\u8abf\uff08\u4f8b\u5982\uff1a`D \u5927\u8abf (D Major)`\uff09\u3002\n   - \u652f\u63f4 $\\pm 6$ \u500b\u534a\u97f3\u81ea\u7531\u5347\u964d\uff0c\u62c9\u52d5\u62c9\u687f\u5373\u6642\u9810\u89bd\u76ee\u6a19\u8abf\u6027\uff08\u4f8b\u5982\uff1a`\u76ee\u6a19: G \u5927\u8abf (G Major) [-5]`\uff09\u3002\n   - \u9ede\u64ca\u300c`\u26a1 \u5957\u7528\u8b8a\u8abf`\u300d\u5f8c\u6b63\u5f0f\u8abf\u5ea6 4 \u57f7\u884c\u7dd2 Phase-Vocoder \u8b8a\u8abf\u6f14\u7b97\u5668\uff1b\u9f13\u7d44\u8ecc\u9053 100% \u81ea\u52d5 Bypass \u4fdd\u7559\u539f\u59cb\u885d\u64ca\u529b\u9053\uff0c\u4eba\u8072\u8207\u6a02\u5668\u9396\u5b9a\u5171\u632f\u5cf0\u9ad8\u4fdd\u771f\u8b8a\u8abf\u3002\n\n6. \u23f1\ufe0f **\u6642\u9593\u8ef8\u62cd\u901f\u667a\u6167\u5075\u6e2c\u8207 21 \u8ecc\u7121\u640d\u6642\u9593\u62c9\u4f38 (Tempo / BPM Stretch)**\uff1a\n   - \u52d5\u614b\u5075\u6e2c\u539f\u66f2 BPM\uff0c\u652f\u63f4 50 ~ 220 BPM \u81ea\u7531\u8abf\u6574\uff0c\u8b8a\u901f\u4e0d\u8b8a\u8abf\u3002\n\n7. \ud83c\udf2b\ufe0f **\u6df7\u97f3\u53f0\u8655\u7406\u4e2d\u534a\u900f\u660e\u8b8a\u6697\u906e\u7f69 (Busy Dimming Overlay)**\uff1a  \n   - \u57f7\u884c\u795e\u7d93\u8b8a\u8abf\u3001\u6642\u9593\u62c9\u4f38\u3001\u6df1\u5ea6\u5206\u8ecc\u3001\u8f09\u5165\u6b77\u53f2\u5c08\u6848\u6216\u5408\u4f75\u532f\u51fa\u6642\uff0c\u4e0b
